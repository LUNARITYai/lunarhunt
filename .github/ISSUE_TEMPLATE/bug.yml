name: Bug
description: Incorrect behaviour. The fix needs a test that fails on main unless test:waived.
labels:
  - "type:bug"
body:
  - type: markdown
    attributes:
      value: |
        Work starts from this issue (ADR-0001, C-09). Branch `<type>/<issue-number>-<slug>`. `<type>` comes from the issue's `type:*` label (ADR-0012).

        A `type:bug` pull request must add or change a test that fails on `main` and passes on the fix branch (C-15). The only exception is the label `test:waived` with a written justification; that pull request is `risk:high` and needs a human.

        A small bug does not need a spec unless a Charter `require_spec_for` rule matches (ADR-0011).

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What is broken, and what correct behaviour looks like.
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: |
        EARS notation, one criterion per line (ADR-0011):
        THE SYSTEM SHALL …
        WHEN <trigger>, THE SYSTEM SHALL …
        WHILE <state>, THE SYSTEM SHALL …
        IF <unwanted condition>, THE SYSTEM SHALL …
        WHERE <feature is enabled>, THE SYSTEM SHALL …
    validations:
      required: true

  - type: input
    id: spec
    attributes:
      label: Linked spec
      description: Path to the spec, if one exists (ADR-0011). Optional for a small bug.
      placeholder: docs/specs/YYYY-MM-DD-slug.md
    validations:
      required: false

  - type: textarea
    id: allowed-paths
    attributes:
      label: Allowed paths
      description: Paths an agent may edit. The issue may narrow the Charter allowed paths, never widen them (C-11).
      placeholder: |
        apps/api/**
    validations:
      required: true

  - type: dropdown
    id: risk
    attributes:
      label: Risk
      description: Expected risk class (ADR-0008, ADR-0013). The risk-classifier Warden sets the pull-request label and overrides this hint. `test:waived` and `needs:human` make the pull request risk:high.
      options:
        - "risk:low"
        - "risk:medium"
        - "risk:high"
    validations:
      required: true
