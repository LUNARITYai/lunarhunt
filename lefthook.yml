# To be generated by `wardens sync` from The Charter (ADR-0003).
# Hand-written until the Wardens engine exists. Do not treat this copy as the
# long-term source of truth.

pre-commit:
  commands:
    biome:
      glob: "*.{js,jsx,ts,tsx,json,jsonc,css,yml,yaml}"
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true -- {staged_files}
      stage_fixed: true
    ruff:
      glob: "*.py"
      run: uv run --frozen ruff check --fix {staged_files} && uv run --frozen ruff format {staged_files}
      stage_fixed: true

pre-push:
  commands:
    check:
      run: pnpm check
