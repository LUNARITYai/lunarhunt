packages:
  - "apps/*"
  - "packages/*"
  - "wardens"

# 7 days. pnpm counts minutes (ADR-0014). Strict so a too-new release fails resolution.
minimumReleaseAge: 10080

engineStrict: true

# lefthook's install script links the platform binary and installs git hooks.
# esbuild's postinstall selects the platform binary used by tsup.
allowBuilds:
  esbuild: true
  lefthook: true

# Security: @hey-api/json-schema-ref-parser@1.4.4 pins js-yaml 4.2.0 exactly. Fixes
# GHSA-52cp-r559-cp3m, GHSA-5p4m-2wfm-xmqj and GHSA-2883-xcg3-v3hh (fixed in 4.3.2).
# Remove once @hey-api/json-schema-ref-parser allows js-yaml >=4.3.2.
overrides:
  "js-yaml@>=4.0.0 <4.3.2": 4.3.2

catalog:
  "@testing-library/react": 16.3.3
  "@types/node": 26.6.5
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.1.2
  ajv: 8.20.0
  commander: 15.0.0
  jsdom: 30.1.3
  picomatch: 4.0.7
  react: 19.3.1
  react-dom: 19.3.1
  tsup: 9.0.0
  typescript: 6.0.3
  vite: 8.3.5
  vitest: 5.0.5
  yaml: 2.9.1
  zod: 4.6.7
